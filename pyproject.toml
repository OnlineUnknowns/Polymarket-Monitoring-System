[project]
name = "poly-maker"
version = "0.1.0"
description = "A market making bot for Polymarket prediction markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "poly-maker" }]
keywords = ["polymarket", "market-making", "prediction-markets", "trading", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

# ── Core dependencies ────────────────────────────────────────────────────────
dependencies = [
    # Polymarket / CLOB
    "py-clob-client==0.28.0",
    "poly_eip712_structs==0.0.1",
    "py_order_utils==0.3.2",

    # Ethereum / Web3
    "eth-account==0.13.7",
    "eth-utils==5.3.1",
    "web3==7.14.0",
    "cryptography==46.0.3",

    # Data & analytics
    "pandas==2.3.3",
    "sortedcontainers==2.4.0",

    # Google Sheets integration
    "gspread==6.2.1",
    "gspread-dataframe==4.0.0",
    "google-auth==2.42.1",

    # Networking
    "requests==2.32.5",
    "websockets==15.0.1",

    # Config
    "python-dotenv==1.2.1",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

# ── Build system ──────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_data", "poly_stats", "poly_utils", "data_updater"]

# ── Linting & formatting (ruff replaces black + flake8) ──────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["poly_data", "poly_stats", "poly_utils", "data_updater"]

# ── Type checking ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# ── Testing ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
